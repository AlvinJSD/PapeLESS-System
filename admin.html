<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PapeLESS - Admin Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body>

<div class="container-fluid d-flex align-items-center justify-content-center py-5">

  <div class="login-wrapper" style="max-width: 420px; width: 100%;">

    <div class="login-card">

      <div class="text-center mb-4">
        <h4 class="brand-title">Admin Access</h4>
        <p class="text-muted">Coordinator Login Portal</p>
      </div>

      <form id="adminLoginForm">

        <div class="mb-3">
          <label>Admin Username</label>
          <input type="text" id="adminUser" class="form-control">
        </div>

        <div class="mb-3">
          <label>Password</label>
          <input type="password" id="adminPass" class="form-control">
        </div>

        <button type="submit" class="btn btn-custom w-100">Login as Admin</button>

        <div class="text-center mt-3">
          <a href="index.html">← Back to Login</a>
        </div>

      </form>

    </div>

  </div>

</div>

<script>
document.getElementById("adminLoginForm").addEventListener("submit", function(e){
  e.preventDefault();

  const user = document.getElementById("adminUser").value;
  const pass = document.getElementById("adminPass").value;

  //  SIMPLE SAMPLE CREDENTIAL (for testing only)
  if(user === "admin" && pass === "1234"){
    window.location.href = "admin-dashboard.html";
  } else {
    alert("Invalid admin credentials");
  }
});
</script>

</body>
</html>
